services:
  postgres:
    image: postgres:16-alpine
    container_name: prisma_postgres_db
    restart: always
    environment:
      POSTGRES_USER: pwa-backend-user
      POSTGRES_PASSWORD: pwa
      POSTGRES_DB: pwa-backend-db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
